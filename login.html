<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — BIMDEC Document System</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
  <div class="stage">
    <div class="authwrap">
      <div class="authcard">
        <div class="auth-brand">
          <img src="assets/logo.png" alt="BIMDEC logo">
          <div>
            <div class="name">BIMDEC Document System</div>
            <div class="tag">Client &amp; Admin Portal</div>
          </div>
        </div>

        <h2>Welcome back</h2>
        <p class="sub" id="subtext">Sign in to continue to your portal.</p>

        <div class="roletabs">
          <button type="button" id="tab-client" onclick="setRole('client')">Client</button>
          <button type="button" id="tab-admin" onclick="setRole('admin')">Admin</button>
        </div>

        <div class="msg error" id="msg"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="btn-primary" type="submit">Sign in</button>
        </form>

        <div class="authfoot">
          Don't have an account? <a href="signup.html">Create an account</a><br>
          <a href="index.html">&larr; Back to welcome</a><br>
          Forgot your password? Contact an administrator.
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/supabaseDb.js"></script>
<script>
let currentRole = 'client';

function setRole(role){
  currentRole = role;
  document.getElementById('tab-client').classList.toggle('active', role==='client');
  document.getElementById('tab-admin').classList.toggle('active', role==='admin');
  document.getElementById('subtext').textContent = role === 'admin'
    ? 'Sign in with your BIMDEC staff account to prepare documents.'
    : 'Sign in to view the documents issued to you.';
  hideMsg();
}

function showMsg(text, kind){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + (kind || 'error');
}
function hideMsg(){
  const el = document.getElementById('msg');
  el.className = 'msg';
}

async function handleLogin(evt){
  evt.preventDefault();
  hideMsg();
  const submitBtn = evt.target.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const result = await DB.login(email, password, currentRole);
  submitBtn.disabled = false;
  if(!result.ok){
    showMsg(result.error, 'error');
    return false;
  }
  window.location.href = currentRole === 'admin' ? 'admin/dashboard.html' : 'client/dashboard.html';
  return false;
}

(function init(){
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role') === 'admin' ? 'admin' : 'client';
  setRole(role);
  if(params.get('created')) showMsg('Account created — sign in below.', 'ok');
})();
</script>
</body>
</html>
