<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — BIMDEC Document System</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
  <div class="stage">
    <div class="authwrap">
      <div class="authcard">
        <div class="auth-brand">
          <img src="assets/logo.png" alt="BIMDEC logo">
          <div>
            <div class="name">BIMDEC Document System</div>
            <div class="tag">Client &amp; Admin Portal</div>
          </div>
        </div>

        <div id="step-form">
          <div class="invite-badge" id="inviteBadge" style="background:var(--warning,#f59e0b);">Invitation code temporarily not required</div>
          <h2 id="formTitle">Create your account</h2>
          <p class="sub" id="formSub">Signup is normally invitation-only, but that check is switched off for now — pick a role below and create your account directly.</p>

          <div class="msg error" id="formMsg"></div>

          <form id="signupForm" onsubmit="return handleSignup(event)">
            <div class="field">
              <label for="signupRole">Account type</label>
              <select id="signupRole" onchange="updateRoleFields()">
                <option value="admin">Admin</option>
                <option value="client">Client</option>
              </select>
            </div>
            <div class="field">
              <label for="fullName">Full name</label>
              <input type="text" id="fullName" required placeholder="e.g. Juan Dela Cruz">
            </div>
            <div class="field">
              <label for="orgOrPosition" id="orgLabel">Position / title</label>
              <input type="text" id="orgOrPosition" placeholder="e.g. System Administrator">
            </div>
            <div class="field">
              <label for="phone">Phone (optional)</label>
              <input type="text" id="phone" placeholder="e.g. 09xx-xxx-xxxx">
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" required autocomplete="username" placeholder="you@example.com">
            </div>
            <div class="row2">
              <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
              </div>
              <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="Re-enter password">
              </div>
            </div>
            <button class="btn-primary" type="submit">Create account</button>
          </form>
        </div>

        <div class="authfoot">
          Already have an account? <a href="login.html">Sign in</a><br>
          <a href="index.html">&larr; Back to welcome</a>
        </div>
      </div>
    </div>
  </div>

<script src="assets/js/db.js"></script>
<script>
function showMsg(id, text){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show error';
}
function hideMsg(id){
  document.getElementById(id).className = 'msg';
}

function updateRoleFields(){
  const isAdmin = document.getElementById('signupRole').value === 'admin';
  document.getElementById('formTitle').textContent = isAdmin ? 'Create your Admin account' : 'Create your Client account';
  document.getElementById('formSub').textContent = isAdmin
    ? 'This account will be able to prepare and manage documents. (Invite code check is switched off for now.)'
    : 'This account will let you view documents issued to you. (Invite code check is switched off for now.)';
  document.getElementById('orgLabel').textContent = isAdmin ? 'Position / title' : 'Company / organization';
}

function handleSignup(evt){
  evt.preventDefault();
  hideMsg('formMsg');
  const role = document.getElementById('signupRole').value;
  const fullName = document.getElementById('fullName').value.trim();
  const orgOrPosition = document.getElementById('orgOrPosition').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if(password !== confirmPassword){
    showMsg('formMsg', 'Passwords do not match.');
    return false;
  }

  const result = DB.createUser({ role, fullName, email, password, orgOrPosition, phone });
  if(!result.ok){
    showMsg('formMsg', result.error);
    return false;
  }

  window.location.href = 'login.html?role=' + role + '&created=1';
  return false;
}

updateRoleFields();
</script>
</body>
</html>
