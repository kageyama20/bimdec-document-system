name: Keep free-tier services awake

# Free hosting tiers pause/sleep after a period of total inactivity:
#  - Render free web services sleep after ~15 minutes idle (fine — the
#    admin portal wakes it on demand, no action needed for that part).
#    This applies to the email backend only. The frontend is a Render
#    static site, which is CDN-served and never sleeps.
#  - Supabase free projects PAUSE after 7 days with zero database
#    activity, and have to be manually resumed from the dashboard.
# This workflow runs once a day and pings both, which is enough to keep
# a Supabase project from ever reaching that 7-day mark, and doubles as
# a cheap uptime check for the email backend.
#
# Setup:
#  1. Push this repo to GitHub.
#  2. Add two repository secrets (Settings → Secrets and variables → Actions):
#       BACKEND_HEALTH_URL   e.g. https://bimdec-email.onrender.com/health
#       SUPABASE_PING_URL    e.g. https://YOUR-PROJECT.supabase.co/rest/v1/  (any lightweight authenticated endpoint works)
#     If you haven't set up Supabase yet, leave SUPABASE_PING_URL unset —
#     that step is skipped automatically.

on:
  schedule:
    - cron: '0 3 * * *' # daily, 03:00 UTC — adjust as you like
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping email backend
        if: ${{ vars.BACKEND_HEALTH_URL != '' || secrets.BACKEND_HEALTH_URL != '' }}
        run: curl -fsS "${{ secrets.BACKEND_HEALTH_URL || vars.BACKEND_HEALTH_URL }}" || true

      - name: Ping Supabase project
        if: ${{ vars.SUPABASE_PING_URL != '' || secrets.SUPABASE_PING_URL != '' }}
        run: curl -fsS "${{ secrets.SUPABASE_PING_URL || vars.SUPABASE_PING_URL }}" || true
